[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdff-tools"
version = "0.2.0"
description = "SDFF 格式解析器：DCS 流程图 (.pic) 与工程点表 (Tags.mdb)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ff.dou" }]
keywords = ["sdff", "pic", "dcs", "scada", "hmi", "reverse-engineering"]
dependencies = []   # 解析器只用 stdlib：struct + zlib

[project.optional-dependencies]
# 读 Access Jet DB 点表。纯 Python，不需要 ODBC / mdbtools。
tagdb = ["access_parser>=0.0.6"]
dev = ["pytest>=7"]

[project.scripts]
sdff = "sdff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
